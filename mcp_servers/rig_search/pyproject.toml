[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-search"
version = "0.2.0"
description = "Reusable web search router with MCP and CLI adapters"
requires-python = ">=3.10"

[project.scripts]
rig-search = "rig_search.cli:main"
rig-search-mcp = "rig_search.mcp:main"
rig-search-ingest = "rig_search.ingest:main"

[tool.setuptools.packages.find]
include = ["rig_search*"]
